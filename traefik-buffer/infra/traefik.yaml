---
# Namespace for Traefik infrastructure
apiVersion: v1
kind: Namespace
metadata:
  name: infra
  labels:
    app.kubernetes.io/part-of: traefik-buffer
---
# Internal-only Traefik Service (used by other services)
# ExternalName pointing to k3s Traefik in kube-system namespace
apiVersion: v1
kind: Service
metadata:
  name: traefik-internal
  namespace: infra
  labels:
    app: traefik
spec:
  type: ExternalName
  externalName: traefik.kube-system.svc.cluster.local
  ports:
    - name: web
      port: 80
---
# Metrics Service for Prometheus scraping
# ExternalName pointing to k3s Traefik metrics
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
  namespace: infra
  labels:
    app: traefik
spec:
  type: ExternalName
  externalName: traefik.kube-system.svc.cluster.local
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
