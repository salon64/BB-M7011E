apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-envoy-config
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: http_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: supabase_buffer
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: supabase
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: supabase_app
                                timeout: 120s
                                retry_policy:
                                  retry_on: 5xx,connect-failure,refused-stream
                                  num_retries: 3
                    http_filters:
                      - name: envoy.filters.http.router

      clusters:
        - name: supabase_app
          connect_timeout: 5s
          type: static
          lb_policy: round_robin
          load_assignment:
            cluster_name: supabase_app
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 192.168.1.136
                          port_value: 8000
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 100
                max_pending_requests: 200   # REAL HTTP BUFFER
                max_requests: 100

    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
