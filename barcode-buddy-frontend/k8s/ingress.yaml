apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: barcode-buddy-frontend
  annotations:
    # Uncomment and configure based on your ingress controller
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx  # Change based on your ingress controller
  rules:
  - host: barcode-buddy.yourdomain.com  # CHANGE THIS
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: barcode-buddy-frontend
            port:
              number: 80
  # Uncomment for TLS/HTTPS
  # tls:
  # - hosts:
  #   - barcode-buddy.yourdomain.com
  #   secretName: barcode-buddy-tls
