image:
  repository: justingav/discord-bot
  tag: latest
  pullPolicy: Always

commandPrefix: "!"
logLevel: "INFO"

keycloak:
  url: "http://keycloak:8080"
  realm: "BB"
  discordClientId: "discord-to-user"

supabase:
  url: "http://supabase:8000"

insecure: true

# JWT cache TTL in seconds (default: 1 day)
jwtCacheTtl: "86400"

# URL for users to link their Discord account
accountLinkUrl: "https://example.com/link-account"

services:
  userService: "http://user-service"
  paymentService: "http://payment-service"
  itemService: "http://item-service"

resources:
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"
