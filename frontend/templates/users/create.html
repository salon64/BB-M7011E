{% extends "base.html" %}

{% block title %}Create Account - Bättre Bosch{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1 style="margin-bottom: 2rem;">Create Account</h1>
    
    <div class="card">
        <form method="POST" action="{{ url_for('users_create') }}">
            <div class="form-group">
                <label class="form-label" for="card_id">Card ID *</label>
                <input type="number" id="card_id" name="card_id" class="form-control" required>
                <small style="color: var(--text-muted); display: block; margin-top: 0.25rem;">
                    Your unique card identifier
                </small>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="first_name">First Name *</label>
                <input type="text" id="first_name" name="first_name" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="last_name">Last Name *</label>
                <input type="text" id="last_name" name="last_name" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email *</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password *</label>
                <input type="password" id="password" name="password" class="form-control" required minlength="8">
                <small style="color: var(--text-muted); display: block; margin-top: 0.25rem;">
                    Minimum 8 characters
                </small>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Create Account</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
        
        <div style="margin-top: 1.5rem; text-align: center; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent);">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
