{% extends "base.html" %}

{% block title %}Make Payment - Bättre Bosch{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1 style="margin-bottom: 2rem;">Make Payment</h1>
    
    <div class="card">
        <form method="POST" action="{{ url_for('payments_debit') }}">
            <div class="form-group">
                <label class="form-label" for="item_id">Select Item *</label>
                <select id="item_id" name="item_id" class="form-control" required>
                    <option value="">Choose an item...</option>
                    {% for item in items %}
                        <option value="{{ item.id }}" data-price="{{ item.price }}" {% if prefilled_item_id and prefilled_item_id|string == item.id|string %}selected{% endif %}>
                            {{ item.name }} - {{ (item.price / 100)|round(2) }} kr
                        </option>
                    {% endfor %}
                </select>
                <small style="color: var(--text-muted); display: block; margin-top: 0.25rem;">
                    Select the item to purchase. The price will be debited from your balance.
                </small>
            </div>
            
            <div style="padding: 1rem; background: rgba(6, 182, 212, 0.1); border-radius: 6px; margin: 1.5rem 0; border-left: 3px solid var(--accent);">
                <strong style="color: var(--accent);">Selected Item:</strong>
                <div id="selected_item_info" style="color: var(--text-muted); display: block; margin-top: 0.5rem;">
                    None selected
                </div>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Process Payment</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% block extra_js %}
<script>
    function updateSelectedItem() {
        const selectElement = document.getElementById('item_id');
        const selectedOption = selectElement.options[selectElement.selectedIndex];
        const infoDiv = document.getElementById('selected_item_info');
        
        if (selectedOption.value) {
            const price = parseFloat(selectedOption.dataset.price);
            const priceInKr = (price / 100).toFixed(2);
            infoDiv.innerHTML = `<strong>${selectedOption.text}</strong>`;
        } else {
            infoDiv.innerHTML = 'None selected';
        }
    }
    
    // Update on page load
    document.addEventListener('DOMContentLoaded', updateSelectedItem);
    
    // Update on change
    document.getElementById('item_id').addEventListener('change', updateSelectedItem);
</script>
{% endblock %}
{% endblock %}
