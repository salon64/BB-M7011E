version: '3.8'

services:
  frontend:
    build: .
    container_name: barcode-buddy-frontend
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key-change-me}
      - DEBUG=${DEBUG:-false}
      - ITEMS_SERVICE_URL=${ITEMS_SERVICE_URL:-http://host.docker.internal:8001}
      - USERS_SERVICE_URL=${USERS_SERVICE_URL:-http://host.docker.internal:8002}
      - TRANSACTIONS_SERVICE_URL=${TRANSACTIONS_SERVICE_URL:-http://host.docker.internal:8003}
      - KC_URL=${KC_URL:-https://keycloak.ronstad.se}
      - KC_REALM=${KC_REALM:-BB}
      - KC_CLIENT_ID=${KC_CLIENT_ID:-public-user}
      - INSECURE=${INSECURE:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# If you want to run everything together (add your other services):
#
#   items-service:
#     image: your-items-service:latest
#     ports:
#       - "8001:8001"
#
#   users-service:
#     image: your-users-service:latest
#     ports:
#       - "8002:8002"
#
#   transactions-service:
#     image: your-transactions-service:latest
#     ports:
#       - "8003:8003"
